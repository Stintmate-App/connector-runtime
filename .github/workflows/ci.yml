name: ci

# Minutes are limited: CI runs by hand only (Actions > ci > Run workflow); every check runs
# locally before each merge.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job: every job pays the runner's start.
  ci:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # Real-time tests skip themselves on GitHub's shared runners.
          STINTMATE_SHARED_RUNNER: "1"
          # No CI runner has a desktop with OpenGL: the window's test skips.
          STINTMATE_NO_DESKTOP: "1"
      # cargo-deny, from a prebuilt binary.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses advisories bans sources
