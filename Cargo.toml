[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Stintmate-App/connector-runtime"
authors = ["The Stintmate authors"]
publish = false

[workspace.dependencies]
stintmate-connector-resources = { path = "crates/resources" }
stintmate-connector-platform = { path = "crates/platform" }
stintmate-connector-i18n = { path = "crates/i18n" }
stintmate-connector-wire = { path = "crates/wire" }
stintmate-connector-link = { path = "crates/link" }
stintmate-connector-testing = { path = "crates/testing" }
stintmate-connector-control = { path = "crates/control" }
# The IPC library, pinned to a release tag like any dependency.
stintmate-ipc = { git = "https://github.com/Stintmate-App/stintmate-ipc", tag = "v0.3.3" }
stintmate-ipc-check = { git = "https://github.com/Stintmate-App/stintmate-ipc", tag = "v0.3.3" }
windows-sys = "0.61"
thiserror = "2"
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
tracing-appender = "0.2"
tempfile = "3"
rmp-serde = "1"
tray-icon = { version = "0.26", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
embed-resource = "3"
png = { version = "0.18", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
# Symbols stripped from release binaries; unwinding stays (no panic = "abort"): a panic in a
# thread is caught and logged by the panic hook.
strip = "symbols"
